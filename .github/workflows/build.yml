name: Build and Release CLI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.6'

    - name: Download Dependencies
      run: go mod download

    - name: Build CLI
      run: |
        mkdir -p build
        GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o build/codedrop-${{ matrix.os }}-${{ matrix.arch }} ./cmd/cli/main.go

    - name: Rename Windows binary
      if: matrix.os == 'windows'
      run: mv build/codedrop-${{ matrix.os }}-${{ matrix.arch }} build/codedrop-${{ matrix.os }}-${{ matrix.arch }}.exe

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: codedrop-${{ matrix.os }}-${{ matrix.arch }}
        path: build/codedrop-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        merge-multiple: true

    - name: List artifacts
      run: ls -lh artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
